name: Update data

on:
  schedule:
    - cron: '0 6 10 * *'     # 06:00 UTC on the 10th of every month (08:00 in Vienna)
  workflow_dispatch:          # adds a "Run workflow" button on GitHub

permissions:
  contents: write             # allows this job to push the new data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # stop if something hangs (e.g. an API that never answers)

    steps:
      - uses: actions/checkout@v5

      # System libraries some R packages need (sf, geobr, curl, xml2…)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      # R, in the same version recorded in renv.lock, with fast pre-built packages
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # Installs the exact package versions from pipeline/renv.lock (cached between runs)
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: pipeline

      - name: World Bank indicators
        working-directory: pipeline
        run: Rscript run_pipeline.R

      - name: Brazilian foreign trade (Comex Stat)
        working-directory: pipeline
        run: Rscript run_trade.R

      - name: Data quality tests
        working-directory: pipeline
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      # Make sure the website still builds with the new data before publishing it
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build website
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run build

      # Commit only if the JSON files changed
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --staged --quiet; then
            echo "No data changes this month."
          else
            git commit -m "data: monthly update ($(date +%Y-%m))"
            git push
          fi